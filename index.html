<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strum</title>
    <meta
      name="description"
      content="Wave a hand across the strings, or drag your pointer or finger — a webcam-and-touch instrument you play live in the browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Strum</h1>
      <p data-testid="intro">
        Eight strings, <em>do</em> up to <em>do</em>. Wave a hand across them on camera, or drag a
        pointer or finger — same strings, same tune, either way. There is nothing to get right.
      </p>

      <div id="instrument">
        <div data-testid="tap-to-start" id="tap-to-start">
          <button data-testid="start-button" id="start-button" type="button">
            Tap, click, or press any key to begin
          </button>
        </div>

        <div data-testid="entry-gate" id="entry-gate" hidden>
          <p>Pick how you want to play:</p>
          <div class="gate-buttons">
            <button data-testid="use-camera" id="use-camera" type="button">
              Use my camera
            </button>
            <button data-testid="use-pointer" id="use-pointer" type="button">
              Use touch / mouse
            </button>
          </div>
          <p class="gate-hint">...or just press 1–8 on your keyboard.</p>
        </div>

        <canvas data-testid="play-area" id="stage" aria-label="Strings — drag or wave across them to play"></canvas>

        <div id="controls" hidden>
          <button id="switch-input" type="button">Switch input</button>
        </div>

        <p id="camera-status" role="status" hidden></p>

        <div id="camera-panel" hidden>
          <div id="camera-frame">
            <!-- The visible preview when hand tracking is running: the camera
                 frame, the hand's landmarks and the boundary lines, composited
                 and mirrored in one draw so they cannot drift apart. -->
            <canvas id="camera-view" aria-hidden="true" hidden></canvas>
            <video
              data-testid="camera-preview"
              id="camera-preview"
              autoplay
              playsinline
              muted
              hidden
            ></video>
            <!-- Debug only (DEBUG_OVERLAY in main.ts): boundary lines and the
                 tracked Position, drawn un-mirrored over the mirrored video. -->
            <canvas id="debug-overlay" aria-hidden="true" hidden></canvas>
          </div>
          <pre id="debug-readout" aria-hidden="true" hidden></pre>
        </div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
